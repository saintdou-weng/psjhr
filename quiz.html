function grade(t,ans){const n=t.q.length;
  if(t.kind==='score'){let ok=0;t.q.forEach((q,i)=>{if(ans[i]===q.a)ok++});const pct=Math.round(ok/n*100);return {ok,n,pct,pass:t.pass?pct>=t.pass:null,sum:ok+'/'+n+' ('+pct+'%)'}}
  if(t.kind==='type16'){const c={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};t.q.forEach((q,i)=>{if(ans[i]==null)return;c[q.x[ans[i]]]++});
    const ax=['EI','SN','TF','JP'].map(k=>{const a=c[k[0]],b=c[k[1]],tot=a+b||1;return {k,a:Math.round(a/tot*100),b:100-Math.round(a/tot*100),pick:a>=b?k[0]:k[1]}});const code=ax.map(x=>x.pick).join('');
    return {code,ax,sum:code+' '+ax.map(x=>x.pick+(x.pick===x.k[0]?x.a:x.b)+'%').join(' '),pass:null}}
  if(t.kind==='likert'){const sc={};Object.keys(t.dims).forEach(d=>sc[d]=[]);t.q.forEach((q,i)=>{if(ans[i]==null)return;sc[q.d].push(q.r?6-ans[i]:ans[i])});

  if(t.kind==='style'){const c={};Object.keys(t.types).forEach(k=>c[k]=0);t.q.forEach((q,i)=>{if(ans[i]!=null)c[q.k[ans[i]]]++});const top=Object.keys(c).sort((a,b)=>c[b]-c[a]);return {c,top,sum:t.types[top[0]][0],pass:null}}}

      '<h4>'+u('str')+'</h4><p>'+esc(L(p.s))+'</p><h4>'+u('blind')+'</h4><p>'+esc(L(p.b))+'</p><h4>'+u('comm')+'</h4><p>'+esc(L(p.c))+'</p><h4>'+u('mgmt')+'</h4><p>'+esc(L(p.m))+'</p><p class="note">'+u('typeNote')+'</p>'}
  else if(t.kind==='likert'){const cols={O:'#8b5cf6',C:'#2563eb',E:'#f59e0b',A:'#16a34a',N:'#dc2626'};
    h+=Object.keys(t.dims).map(d=>{const pct=g.pc[d],lv=pct>=67?'高':pct>=34?'中':'低';return '<div class="dim"><div class="t"><span>'+t.dims[d][0]+' <small>'+t.dims[d][1]+'</small></span><span>'+pct+'%・'+lv+'</span></div><div class="b"><i style="width:'+pct+'%;background:'+(cols[d]||'var(--acc)')+'"></i></div><small>'+t.dims[d][2]+'</small></div>'}).join('')+'<p class="note">分數只代表這次作答的傾向，沒有好壞；不同工作適合不同組合。</p>'}
  else if(t.kind==='style'){const k=g.top[0];h+='<p style="font-size:20px;margin:10px 0"><b>'+t.types[k][0]+'</b> <small>'+t.types[k][1]+'</small></p><p>'+esc(t.types[k][2])+'</p>'+g.top.map(k=>'<div class="dim"><div class="t"><span>'+t.types[k][0]+'</span><span>'+g.c[k]+' / '+t.q.length+'</span></div><div class="b"><i style="width:'+(g.c[k]/t.q.length*100)+'%;background:var(--acc)"></i></div></div>').join('')}
  return h}
function showResult(t,rec,fromHist,auto){stopTick();T=t;VIEW=()=>showResult(t,rec,fromHist,auto);
  let h='<div class="res">'+(auto?'<p style="color:var(--bad);font-weight:800">'+u('timeUp')+'</p>':'')+'<b style="font-size:17px">'+t.icon+' '+esc(L(t.title))+' — '+u('result')+'</b><div class="note">👤 '+esc(rec.who||'—')+(rec.emp?' · '+esc(rec.emp):'')+' · '+loc(rec.at)+'</div>'+resultBody(t,rec)+'</div>';
  if(!fromHist)h+=sendBox(rec);
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="again">'+u('again')+'</button><button class="btn g" id="copy">'+u('copy')+'</button><button class="btn g" id="home">'+u('home')+'</button>'+(fromHist?'<button class="btn g" id="delh" style="color:var(--bad)">'+u('del')+'</button>':'')+'</div>';
  $('app').innerHTML=h;scrollTo(0,0);$('again').onclick=()=>intro(t.id);$('home').onclick=home;
  $('copy').onclick=()=>{try{navigator.clipboard.writeText(msgText(rec))}catch(e){}$('copy').textContent=u('copied')};
  if($('delh'))$('delh').onclick=()=>{if(!confirm(u('delAsk')))return;LS.set('quiz_hist2',HIST().filter(r=>r.at!==rec.at));home()};
  if(!fromHist)bindSend(rec)}
/* ───── 發群組（用這台裝置已設定好的 PSJHR 雲端；金鑰不寫在程式裡） ───── */
const DEFAULT_GAS='https://script.google.com/macros/s/AKfycbx9Pdt5vu_AcTHCrlLH4lcVONXS_VoE47SEjDUn7Iv27C2CRgoADRLpalVIJQHWBcqK/exec';
function cloud(){let key='',url=DEFAULT_GAS;try{key=String(JSON.parse(localStorage.getItem('psjhr_synckey')||'""')||'').trim()}catch(e){}
  try{const db=JSON.parse(localStorage.getItem('psjhr_db')||'null');if(db&&db.sync&&db.sync.gas)url=db.sync.gas}catch(e){}return {key,url,ok:!!key&&/\/exec$/.test(url)}}
function msgText(rec){const t=byId(rec.id),g=grade(t,rec.ans||[]);const lines=['🧠 '+u('quizAt')+'｜'+L(t.title),'👤 '+(rec.who||'—')+(rec.emp?'（'+rec.emp+'）':'')];
  if(rec.mode==='exam')lines.push('📝 '+u('examRec'));
  else if(t.kind==='score')lines.push('🏆 '+u('score')+'：'+g.ok+'/'+g.n+'（'+g.pct+'%）'+(g.pass!=null?' '+(g.pass?u('passed'):u('failed')):''));
  else if(t.kind==='type16')lines.push('🧩 '+g.code+' '+L(t.profiles[g.code].n),'📊 '+g.ax.map(x=>x.k[0]+x.a+'/'+x.k[1]+x.b).join('  '));
  else lines.push('📊 '+g.sum);
  lines.push('⏱ '+u('used')+'：'+minTxt(rec.secs||0),'📅 '+loc(rec.at));return lines.join('\n')}
function sendBox(rec){const c=cloud();return '<div class="res" id="sbox"><b>'+u('askSend')+'</b>'+(c.ok?'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="snd" style="flex:1">'+u('send')+'</button><button class="btn g" id="nsnd" style="flex:1">'+u('nosend')+'</button></div>':'<p class="note">'+u('noCloud')+'</p>')+'<div id="smsg" class="note" style="margin-top:6px"></div></div>'}
function bindSend(rec){if($('nsnd'))$('nsnd').onclick=()=>{$('sbox').remove()};
  if($('snd'))$('snd').onclick=async()=>{const c=cloud();$('snd').disabled=true;try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:'psjhr',k:c.key,action:'hr_tg',text:msgText(rec),buttons:[[['🧠 '+u('quizAt'),location.href.split('#')[0]]]]})});const j=await r.json();if(!j.ok)throw new Error(j.msg||j.error||'error');$('sbox').innerHTML='<b style="color:var(--ok)">'+u('sent')+'</b>';const hs=HIST(),x=hs.find(z=>z.at===rec.at);if(x){x.sent=1;LS.set('quiz_hist2',hs)}}catch(e){$('snd').disabled=false;$('smsg').textContent=u('sendFail')+(e.message||e)}}}
/* ───── HR 批次閱卷 ───── */
function admin(){stopTick();VIEW=admin;
  let h='<div class="res"><b style="font-size:17px">'+u('admin')+'</b><p class="note">'+u('adminD')+'</p><label class="btn" style="display:inline-block">'+u('pick')+'<input type="file" id="af" accept=".json,application/json" multiple hidden></label> <button class="btn g" id="aclr">'+u('clear')+'</button></div>';
  if(BATCH.length){const rows=BATCH.map(b=>{if(b.err)return {b,s:-1};const t=byId(b.id),g=grade(t,b.ans);return {b,t,g,s:g.pct!=null?g.pct:0}}).sort((a,b)=>b.s-a.s);
    h+='<div class="res" style="overflow-x:auto"><table><tr><th>#</th><th>'+u('name')+'</th><th>'+u('test')+'</th><th>'+u('res')+'</th><th>'+u('used')+'</th><th>'+u('date')+'</th></tr>'+rows.map((r,i)=>r.b.err?'<tr><td>'+(i+1)+'</td><td colspan="5" style="color:var(--bad)">'+esc(r.b.file)+'：'+u('bad')+'</td></tr>':'<tr><td>'+(i+1)+'</td><td>'+esc(r.b.who)+(r.b.emp?'<br><small>'+esc(r.b.emp)+'</small>':'')+'</td><td>'+r.t.icon+' '+esc(L(r.t.title))+'</td><td><b style="color:'+(r.g.pass===false?'var(--bad)':'var(--ok)')+'">'+esc(r.t.kind==='type16'?r.g.code+' '+L(r.t.profiles[r.g.code].n):r.g.sum)+'</b>'+(r.g.pass!=null?'<br><small>'+(r.g.pass?u('passed'):u('failed'))+'</small>':'')+'</td><td>'+minTxt(r.b.secs||0)+'</td><td>'+esc(loc(r.b.at).slice(0,10))+'</td></tr>').join('')+'</table></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" id="acsv">'+u('csv')+'</button>'+(cloud().ok?'<button class="btn g" id="asnd">'+u('sendSum')+'</button>':'')+'</div><div id="amsg" class="note"></div>';
    window._rows=rows}
  h+='<button class="btn g" id="home">'+u('home')+'</button>';$('app').innerHTML=h;scrollTo(0,0);$('home').onclick=home;
  $('aclr').onclick=()=>{BATCH=[];admin()};
  $('af').onchange=async e=>{for(const f of e.target.files){try{const j=JSON.parse(await f.text());if(j.app!=='vrt-quiz'||!byId(j.id)||!Array.isArray(j.ans))throw 0;if(!BATCH.some(b=>b.id===j.id&&b.at===j.at&&b.who===j.who))BATCH.push(j)}catch(x){BATCH.push({err:1,file:f.name})}}admin()};
  if($('acsv'))$('acsv').onclick=()=>{const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const lines=[['rank','name','staff_no','test','result','pct','pass','minutes','date'].join(',')].concat(window._rows.filter(r=>!r.b.err).map((r,i)=>[i+1,q(r.b.who),q(r.b.emp),q(L(r.t.title)),q(r.t.kind==='type16'?r.g.code:r.g.sum),r.g.pct==null?'':r.g.pct,r.g.pass==null?'':r.g.pass?'Y':'N',Math.round((r.b.secs||0)/60),loc(r.b.at).slice(0,10)].join(',')));download('quiz_results_'+new Date().toISOString().slice(0,10)+'.csv','﻿'+lines.join('\n'),'text/csv')};
  if($('asnd'))$('asnd').onclick=async()=>{const c=cloud(),ok=window._rows.filter(r=>!r.b.err);const by={};ok.forEach(r=>{(by[r.t.id]=by[r.t.id]||[]).push(r)});
    const text='🗂️ '+u('admin')+'\n'+Object.values(by).map(a=>{const t=a[0].t;const p=a.filter(r=>r.g.pass).length;return t.icon+' '+L(t.title)+'：'+a.length+' 人'+(t.pass?'，'+u('pass')+' '+p+'/'+a.length:'')+'\n'+a.slice(0,15).map((r,i)=>' '+(i+1)+'. '+r.b.who+'　'+(t.kind==='type16'?r.g.code:r.g.sum)).join('\n')}).join('\n\n');
    $('asnd').disabled=true;try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:'psjhr',k:c.key,action:'hr_tg',text,buttons:[]})});const j=await r.json();if(!j.ok)throw new Error(j.msg||j.error||'error');$('amsg').textContent=u('sent')}catch(e){$('asnd').disabled=false;$('amsg').textContent=u('sendFail')+(e.message||e)}}}
paintLang();home();
</script></body></html>
